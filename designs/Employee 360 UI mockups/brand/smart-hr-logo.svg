<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Smart HR">
  <defs>
    <pattern id="dotGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="4.6" fill="#fff"/>
    </pattern>
    <mask id="dotMask">
      <rect width="1200" height="1200" fill="url(#dotGrid)"/>
    </mask>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="130"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="#050608"/>

  <!-- glow, shown only through the dot grid -->
  <g mask="url(#dotMask)">
    <rect width="1200" height="1200" fill="#14161c"/>
    <g filter="url(#soft)">
      <ellipse cx="760" cy="150" rx="330" ry="210" fill="#fdf7ec" opacity=".95"/>
      <ellipse cx="1090" cy="330" rx="230" ry="300" fill="#9fc4e8" opacity=".75"/>
      <ellipse cx="120" cy="790" rx="300" ry="230" fill="#fdf7ec" opacity=".9"/>
      <ellipse cx="480" cy="1040" rx="330" ry="190" fill="#e9eef7" opacity=".7"/>
    </g>
    <g filter="url(#soft2)">
      <ellipse cx="60" cy="420" rx="220" ry="260" fill="#7fa8d4" opacity=".55"/>
      <ellipse cx="1140" cy="900" rx="220" ry="240" fill="#8fb6dd" opacity=".5"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(600 620)">
    <text x="-46" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="Poppins, 'Century Gothic', 'Avenir Next', 'Segoe UI', sans-serif"
          font-size="176" font-weight="500" letter-spacing="-4" fill="#ffffff">Smart HR</text>
    <!-- four point sparkle -->
    <path transform="translate(322 -104) scale(1.5)" fill="url(#sheen)"
          d="M30 0c4.2 21.6 8.4 25.8 30 30-21.6 4.2-25.8 8.4-30 30-4.2-21.6-8.4-25.8-30-30 21.6-4.2 25.8-8.4 30-30z"/>
    <path transform="translate(424 -168) scale(.85)" fill="url(#sheen)"
          d="M30 0c4.2 21.6 8.4 25.8 30 30-21.6 4.2-25.8 8.4-30 30-4.2-21.6-8.4-25.8-30-30 21.6-4.2 25.8-8.4 30-30z"/>
  </g>
</svg>
