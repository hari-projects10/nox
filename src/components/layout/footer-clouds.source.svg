<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="2880" height="1620">
<defs>
<linearGradient id="nx-cloud" x1="0" y1="330" x2="0" y2="690" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fdf9f7"/><stop offset="0.45" stop-color="#f7f1ef"/><stop offset="1" stop-color="#dce3ea"/></linearGradient>
<filter id="nx-brush" x="-10%" y="-20%" width="120%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="7" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="30" xChannelSelector="R" yChannelSelector="G" result="rough"/>
<feGaussianBlur in="rough" stdDeviation="2.6" result="soft"/>
<feTurbulence type="fractalNoise" baseFrequency="0.05 0.18" numOctaves="2" seed="3" result="strokes"/>
<feColorMatrix in="strokes" type="matrix" values="0 0 0 0 0.82  0 0 0 0 0.86  0 0 0 0 0.9  0 0 0 -1.2 0.75" result="tint"/>
<feComposite in="tint" in2="soft" operator="in" result="tintIn"/>
<feMerge><feMergeNode in="soft"/><feMergeNode in="tintIn"/></feMerge>
</filter>
<filter id="nx-haze" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<g filter="url(#nx-brush)" fill="url(#nx-cloud)"><circle cx="600" cy="470" r="132"/><circle cx="470" cy="520" r="96"/><circle cx="745" cy="515" r="108"/><circle cx="350" cy="560" r="82"/><circle cx="870" cy="560" r="84"/><circle cx="225" cy="590" r="76"/><circle cx="120" cy="606" r="92"/><circle cx="990" cy="600" r="62"/><circle cx="30" cy="630" r="70"/><rect x="-40" y="580" width="1100" height="120" rx="40"/><circle cx="1110" cy="598" r="44"/><circle cx="1185" cy="604" r="40"/><circle cx="1330" cy="562" r="70"/><circle cx="1255" cy="606" r="46"/><circle cx="1420" cy="604" r="42"/><circle cx="1525" cy="612" r="52"/><circle cx="1600" cy="620" r="44"/><rect x="1070" y="610" width="600" height="90" rx="30"/></g>
<rect x="-100" y="640" width="1800" height="90" fill="#d3dde6" opacity="0.85" filter="url(#nx-haze)"/>
</svg>